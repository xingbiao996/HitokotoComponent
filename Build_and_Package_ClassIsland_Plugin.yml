name: Build and Package ClassIsland Plugin

on:
  push:
    branches:
      - main  # 指定在main分支的push操作时触发。可以根据需要调整分支名称

jobs:
  build-and-package:
    runs-on: windows-latest  # 使用Windows环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 检出代码

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3  # 设置.NET SDK环境
        with:
          dotnet-version: '8.x'  # 根据项目需求指定.NET版本

      - name: Restore dependencies
        run: dotnet restore  # 恢复项目依赖

      - name: Build project
        run: dotnet build --no-restore -c Release  # 编译项目，使用Release配置

      - name: Publish project
        run: dotnet publish -c Release -o ./publish  # 发布项目到指定目录

      - name: Create ZIP Archive
        run: |
          $projectName = "YourPluginName"  # 替换为你的插件项目名称
          Compress-Archive -Path ./publish/* -DestinationPath "$projectName.zip"  # 创建ZIP文件
          Rename-Item -Path "$projectName.zip" -NewName "$projectName.cipx"  # 重命名为.cipx文件

      - name: Generate MD5 Checksums
        run: |
          $path = "./publish"
          $projectName = "YourPluginName"  # 替换为你的插件项目名称
          .\generate-md5.ps1 $path
          Move-Item -Path "$path\checksums.md" -Destination "./$projectName.cipx.checksums.md"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4  # 上传生成的.cipx文件和checksums.md文件作为构建产物
        with:
          name: ${{ github.sha }}-package  # 构建产物名称，使用提交的SHA值
          path: |
            ${{ github.workspace }}/${{ env.projectName }}.cipx
            ${{ github.workspace }}/${{ env.projectName }}.cipx.checksums.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1  # 创建GitHub Release
        with:
          tag_name: "v${{ github.sha }}"
          name: "Release ${{ github.sha }}"
          body_path: "./${{ env.projectName }}.cipx.checksums.md"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
